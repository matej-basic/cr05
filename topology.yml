# CADMUS CR-05 — Linux OS Security Hardening and Compliance Validation
# Shared sandbox topology, exercised by labs A1 through F1.
#
# Source of truth: this file is derived from cr05/labs/lab_env_description.md, which
# is the authored topology for the course. The Scenario Framework docx left its
# "Network Topology & Traffic Flow" heading empty, so the environment was designed in
# the env description and this file mirrors it, extended with the ubuntu-ref reference
# host that lab E1 scans alongside rhel-srv.
#
# Two networks:
#   access  10.10.10.0/24  management path; every VM has an interface here
#   lab     10.10.20.0/24  production-like segment where controls are tested from outside
# Host IPs start at .4 (.1 gateway and .2 DHCP are reserved by OpenStack; .3 kept free).

name: cadmus-cr05-linux-hardening

hosts:
  - name: ubuntu-ws
    base_box:
      image: ubuntu-noble-x86_64
      mgmt_user: ubuntu
      mgmt_protocol: ssh
    flavor: standard.medium          # primary hardening target; runs the scanner

  - name: rhel-srv
    # Red Hat-family 9 host. The course exercises it hands-on with `firewall-cmd`/`firewalld`
    # and `dnf` (lab C1) and teaches SELinux enforcing mode on it (node N2), so an Ubuntu
    # substitute is not possible. The platform loaded `rocky-9.8-min-x86_64` on 1 Sep 2026;
    # Rocky 9 is binary-compatible with RHEL 9 and needs no subscription, and the labs use no
    # `subscription-manager`. The host name stays `rhel-srv` because the labs, the passkey
    # scripts and `training_definition.json` all address it by that name.
    # `mgmt_user` is the Rocky cloud-image default (`rocky`).
    #
    # BLOCKED as of 4 Sep 2026: the loaded `rocky-9.8-min-x86_64` was built from the Rocky
    # 9.8 minimal *installation* ISO, whose package group omits `cloud-init`. Without it the
    # instance never reads the OpenStack metadata, so no default user is created and the
    # injected SSH key is never written, and provisioning stage 2 cannot reach this host
    # (ssh return code 255) whatever `mgmt_user` says. The four Ubuntu hosts on the same
    # segment connect normally, so the network and the keypair are fine.
    #   Fix: the image has to be rebuilt from Rocky-9-GenericCloud-Base.latest.x86_64.qcow2,
    #   which ships cloud-init enabled with `rocky` as its default user. `mgmt_user` below is
    #   already correct for that image; only `image` changes, and only if the rebuild is
    #   registered under a different name.
    base_box:
      image: rocky-9.8-min-x86_64
      mgmt_user: rocky
      mgmt_protocol: ssh
    flavor: standard.medium

  - name: ubuntu-ref
    base_box:
      image: ubuntu-noble-x86_64
      mgmt_user: ubuntu
      mgmt_protocol: ssh
    flavor: standard.small           # kept at distribution defaults; the unhardened
                                     # comparison target scanned in lab E1

  - name: attacker
    base_box:
      image: ubuntu-noble-x86_64     # course allows "Kali Linux, or Ubuntu 24.04 minimal";
      mgmt_user: ubuntu              # Ubuntu + the attacker_tools role avoids a Kali base-box
      mgmt_protocol: ssh             # deviation while giving the same tooling
    flavor: standard.small

  - name: logstation
    base_box:
      image: ubuntu-noble-x86_64
      mgmt_user: ubuntu
      mgmt_protocol: ssh
    flavor: standard.small           # holds the F1 incident dataset; off the lab segment

routers:
  - name: r-access
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
      mgmt_protocol: ssh
    flavor: standard.small

  - name: r-lab
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
      mgmt_protocol: ssh
    flavor: standard.small

wan:
  name: wan
  cidr: 100.100.100.0/24

networks:
  - name: access
    cidr: 10.10.10.0/24
    accessible_by_user: true         # the segment trainees reach the console on
  - name: lab
    cidr: 10.10.20.0/24
    accessible_by_user: true         # production-like; controls are tested across it

net_mappings:
  # ubuntu-ws — both segments
  - host: ubuntu-ws
    network: access
    ip: 10.10.10.4
  - host: ubuntu-ws
    network: lab
    ip: 10.10.20.4
  # rhel-srv — both segments
  - host: rhel-srv
    network: access
    ip: 10.10.10.5
  - host: rhel-srv
    network: lab
    ip: 10.10.20.5
  # attacker — both segments
  - host: attacker
    network: access
    ip: 10.10.10.6
  - host: attacker
    network: lab
    ip: 10.10.20.6
  # logstation — access only (kept off the lab segment so the F1 dataset cannot be altered)
  - host: logstation
    network: access
    ip: 10.10.10.7
  # ubuntu-ref — both segments
  - host: ubuntu-ref
    network: access
    ip: 10.10.10.8
  - host: ubuntu-ref
    network: lab
    ip: 10.10.20.7

router_mappings:
  - router: r-access
    network: access
    ip: 10.10.10.1
  - router: r-lab
    network: lab
    ip: 10.10.20.1

groups:
  - name: targets              # every host hardened and/or scanned in the course
    nodes:
      - ubuntu-ws
      - rhel-srv
      - ubuntu-ref
  - name: hardening-targets    # the two hosts the learner hardens and that ship with the
    nodes:                     # seeded findings; excludes ubuntu-ref, kept at defaults
      - ubuntu-ws
      - rhel-srv
  - name: ubuntu-targets       # apt-based targets
    nodes:
      - ubuntu-ws
      - ubuntu-ref
  - name: rhel-targets         # dnf-based target
    nodes:
      - rhel-srv
  - name: attacker
    nodes:
      - attacker
  - name: logstation
    nodes:
      - logstation
  # Reserved group, populated by membership only (never redefined):
  - name: monitor-os
    nodes:
      - ubuntu-ws
      - rhel-srv
      - ubuntu-ref
      - attacker
      - logstation
