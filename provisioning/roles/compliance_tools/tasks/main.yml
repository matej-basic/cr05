---
# Compliance scanning tools for the scan targets (ubuntu-ws, rhel-srv, ubuntu-ref).
#
# LICENCE NOTE: CIS-CAT Assessor is licence-gated and must never be downloaded or
# redistributed from this repository. This role installs OpenSCAP and the SCAP Security
# Guide instead: both are freely redistributable and ship CIS-aligned profiles. The lab
# text names "CIS-CAT Assessor"; a trainer who holds a CIS-CAT licence drops the Assessor
# bundle into {{ cis_cat_hook_dir }} and it is used in place of oscap. CIS-CAT is never
# fetched here. The only download is the pinned, checksummed ComplianceAsCode release
# that gives the Debian family its Ubuntu 24.04 datastream.

- name: Install OpenSCAP and SCAP content (Debian family)
  ansible.builtin.apt:
    name: "{{ scap_packages_debian }}"
    state: present
    update_cache: true
  register: pkg_result
  until: pkg_result is succeeded
  retries: 5
  delay: 15
  when: ansible_os_family == 'Debian'

- name: Install OpenSCAP and SCAP content (RHEL family)
  ansible.builtin.dnf:
    name: "{{ scap_packages_rhel }}"
    state: present
  register: pkg_result
  until: pkg_result is succeeded
  retries: 5
  delay: 15
  when: ansible_os_family == 'RedHat'

- name: Check for the upstream Ubuntu 24.04 datastream (Debian family)
  ansible.builtin.stat:
    path: "{{ ssg_upstream_dir }}/{{ ssg_upstream_datastreams[0] }}"
    follow: true
  register: ssg_upstream_ds
  when: ansible_os_family == 'Debian'

- name: Install the upstream ComplianceAsCode datastreams (Debian family)
  when:
    - ansible_os_family == 'Debian'
    - not ssg_upstream_ds.stat.exists
  block:
    - name: Create the upstream content directory
      ansible.builtin.file:
        path: "{{ ssg_upstream_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the pinned ComplianceAsCode release
      ansible.builtin.get_url:
        url: "{{ ssg_upstream_url }}"
        dest: "/var/tmp/scap-security-guide-{{ ssg_upstream_version }}.zip"
        checksum: "{{ ssg_upstream_checksum }}"
        mode: "0644"
        timeout: 120
      register: ssg_upstream_zip
      retries: 5
      delay: 15
      until: ssg_upstream_zip is succeeded

    - name: Extract only the needed datastreams from the release
      ansible.builtin.unarchive:
        src: "/var/tmp/scap-security-guide-{{ ssg_upstream_version }}.zip"
        dest: "{{ ssg_upstream_dir }}"
        remote_src: true
        include: "{{ ssg_upstream_datastreams | map('regex_replace', '^', 'scap-security-guide-' ~ ssg_upstream_version ~ '/') | list }}"
        owner: root
        group: root

    - name: Link each datastream at a version-free path the labs name
      ansible.builtin.file:
        src: "scap-security-guide-{{ ssg_upstream_version }}/{{ item }}"
        dest: "{{ ssg_upstream_dir }}/{{ item }}"
        state: link
      loop: "{{ ssg_upstream_datastreams }}"

    - name: Remove the downloaded release archive
      ansible.builtin.file:
        path: "/var/tmp/scap-security-guide-{{ ssg_upstream_version }}.zip"
        state: absent

- name: Confirm the upstream Ubuntu 24.04 datastream is in place (Debian family)
  ansible.builtin.stat:
    path: "{{ ssg_upstream_dir }}/{{ ssg_upstream_datastreams[0] }}"
    follow: true
  register: ssg_upstream_ds_after
  failed_when: not ssg_upstream_ds_after.stat.exists
  when: ansible_os_family == 'Debian'

- name: Create the report output directory the labs write scans into
  ansible.builtin.file:
    path: "{{ compliance_report_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create the hook directory for a trainer-supplied CIS-CAT Assessor
  ansible.builtin.file:
    path: "{{ cis_cat_hook_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Leave a README explaining the CIS-CAT hook and the OpenSCAP default
  ansible.builtin.copy:
    dest: "{{ cis_cat_hook_dir }}/README.txt"
    content: |
      CIS-CAT Assessor is licence-gated and is NOT shipped with this sandbox.
      OpenSCAP (oscap) with the SCAP Security Guide is installed and is the working
      scanner for the compliance labs. To use CIS-CAT instead, place a licensed
      Assessor bundle in this directory; the lab guide explains how to run it.

      Example OpenSCAP run on rhel-srv (Rocky Linux 9, CIS Level 1 Server):
        oscap xccdf eval --profile cis_server_l1 \
          --results {{ compliance_report_dir }}/scan-$(date +%F)-1.xml \
          --report  {{ compliance_report_dir }}/scan-$(date +%F)-1.html \
          /usr/share/xml/scap/ssg/content/ssg-rl9-ds.xml

      Example OpenSCAP run on Ubuntu 24.04 (upstream content, CIS Level 1 Server):
        oscap xccdf eval --profile cis_level1_server \
          --results {{ compliance_report_dir }}/reference-$(date +%F).xml \
          --report  {{ compliance_report_dir }}/reference-$(date +%F).html \
          {{ ssg_upstream_dir }}/ssg-ubuntu2404-ds.xml
    owner: root
    group: root
    mode: "0644"
