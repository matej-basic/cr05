---
# Tools the attacker client uses to test the targets' controls from outside the host:
# port reachability, SSH policy, lockout behaviour. No exploitation tooling is aimed at
# anything beyond the sandbox.

- name: Install the attacker client toolset (Debian family)
  ansible.builtin.apt:
    name: "{{ attacker_packages }}"
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'
